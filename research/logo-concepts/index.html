<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>病历不归零｜Logo 概念三版</title>
  <style>
    :root{--ink:#16143d;--muted:#65638a;--violet:#5954f6;--warm:#f2b67d;--paper:#fffdf9;--bg:#f6f7ff}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#eef0ff,#fff5ea);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1050px;margin:0 auto;padding:44px 24px 64px}.eyebrow{color:var(--violet);font-weight:700;letter-spacing:.08em;font-size:14px}.intro{max-width:680px;margin-bottom:28px}h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:10px 0 12px;letter-spacing:-.04em}p{color:var(--muted);line-height:1.7;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:rgba(255,255,255,.82);border:1px solid rgba(89,84,246,.12);border-radius:30px;padding:22px;box-shadow:0 18px 42px rgba(49,44,125,.1)}.art{aspect-ratio:1;display:grid;place-items:center;background:#fbfbff;border-radius:22px;margin-bottom:18px}.art img{width:88%;height:88%}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;background:#efefff;color:var(--violet);font-size:12px;font-weight:700}.card h2{font-size:22px;margin:12px 0 7px}.card p{font-size:14px}.note{margin-top:26px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.62);font-size:14px;color:var(--muted)}
    @media (max-width:760px){main{padding:28px 16px 44px}.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}.art{grid-row:span 2;margin:0}.card h2{margin:0 0 6px}}
  </style>
</head>
<body>
  <main>
    <section class="intro"><div class="eyebrow">病历不归零 · LOGO CONCEPTS</div><h1>三种小山羊品牌形象</h1><p>同一套柔和冷暖配色，分别测试陪伴感、记录感和长期品牌识别度。当前仅为视觉草案，不代表最终定稿。</p></section>
    <section class="grid">
      <article class="card"><div class="art"><img src="01-守护小山羊.svg" alt="守护小山羊" /></div><div><span class="tag">A · 陪伴</span><h2>守护小山羊</h2><p>抱住病历卡，第一眼传达“我帮你记着”。亲和力最强，适合老人端。</p></div></article>
      <article class="card"><div class="art"><img src="02-记录小山羊.svg" alt="记录小山羊" /></div><div><span class="tag">B · 记录</span><h2>记录小山羊</h2><p>从圆角档案卡后探头，底部记录线暗示持续累积。品牌和功能结合最清楚。</p></div></article>
      <article class="card"><div class="art"><img src="03-羊角不归零.svg" alt="羊角不归零" /></div><div><span class="tag">C · 符号</span><h2>羊角不归零</h2><p>用圆弧羊角和记录线组成“∞”。最简洁，适合 App 图标和后续多端延展。</p></div></article>
    </section>
    <div class="note">建议优先比较两个问题：老人是否一眼觉得亲切可信；缩小到手机 App 图标后，是否仍能认出“山羊 + 持续记录”。</div>
  </main>
</body>
</html>
